<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Callback</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1rem; }
</style>
</head>
<body>
<p id="m">OAuth callback.</p>
<script>
  const q = location.search;
  if (/[?&](code|error)=/.test(q)) {
    document.getElementById("m").textContent = "Redirecting…";
    location.replace("http://localhost:8724/" + q);
  }
</script>
</body>
</html>
